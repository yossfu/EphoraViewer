name: Build Ephora Viewer

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-ephora.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.22.1'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.5'

      - name: Compile Filament materials (matc 1.56.0)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/filament /tmp/filament-tools
          curl -sSL -o /tmp/filament-linux.tgz https://github.com/google/filament/releases/download/v1.56.0/filament-v1.56.0-linux.tgz
          tar xzf /tmp/filament-linux.tgz -C /tmp/filament-tools
          MATC=$(find /tmp/filament-tools -name matc -type f | head -n 1)
          test -n "$MATC" || { echo "matc no encontrado en el tarball"; exit 1; }
          chmod +x "$MATC"
          "$MATC" -o app/src/main/assets/filament/terrain_prim_lit.filamat app/src/main/materials/terrain_prim_lit.mat
          "$MATC" -o app/src/main/assets/filament/water_unlit.filamat app/src/main/materials/water_unlit.mat
          ls -l app/src/main/assets/filament/

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ephora-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephora-build-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
